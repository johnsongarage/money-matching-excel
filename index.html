<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>배달 정산 맞추기</title>
<meta name="description" content="배달 주문 한 건마다 얼마가 빠지고 통장에 얼마가 들어왔는지 맞춰 보는 데모 (예시 데이터)">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --sub: #6b6a66; --line: #e6e4df;
    --accent: #2f6b4f; --bad: #c2412d; --bad-bg: #fbeae6; --late: #a86a00; --late-bg: #fbf1dc;
    --bar: #d9d5cc;
    --c-fee: #2f6b4f; --c-pay: #5b8f73; --c-vat: #8db39d; --c-deliv: #c2412d; --c-coupon: #d98b3a; --c-ad: #7a6fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --card: #1f1f1d; --ink: #f1f0ec; --sub: #a3a29d; --line: #33322f;
      --accent: #7cc39c; --bad: #ff8a73; --bad-bg: #3a221d; --late: #f0b44c; --late-bg: #352a14;
      --bar: #3a3935;
      --c-fee: #7cc39c; --c-pay: #5fa47f; --c-vat: #3f7a5b; --c-deliv: #ff8a73; --c-coupon: #f0b44c; --c-ad: #a99ee0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --card: #1f1f1d; --ink: #f1f0ec; --sub: #a3a29d; --line: #33322f;
    --accent: #7cc39c; --bad: #ff8a73; --bad-bg: #3a221d; --late: #f0b44c; --late-bg: #352a14;
    --bar: #3a3935;
    --c-fee: #7cc39c; --c-pay: #5fa47f; --c-vat: #3f7a5b; --c-deliv: #ff8a73; --c-coupon: #f0b44c; --c-ad: #a99ee0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  .eyebrow { font-size: 13px; color: var(--sub); margin: 4px 0 6px; }
  .demo-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--late); background: var(--late-bg); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }

  /* 1. 요약 */
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; }
  .hero h1 { font-size: 21px; line-height: 1.45; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .hero h1 b { color: var(--accent); }
  .hero h1 .per { color: var(--bad); }
  .hero-sub { margin: 10px 0 0; color: var(--sub); font-size: 14px; }
  .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 14px; background: var(--bar); }
  .stack span { display: block; height: 100%; }
  .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-top: 6px; }
  .flags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .flag { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .flag.bad { color: var(--bad); background: var(--bad-bg); }
  .flag.late { color: var(--late); background: var(--late-bg); }

  section { margin-top: 22px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  h2 small { font-weight: 400; color: var(--sub); font-size: 13px; margin-left: 4px; }

  /* 4. 항목별 합계 */
  .leaks { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px; }
  .leak { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .leak:last-child { border-bottom: 0; }
  .leak .name { font-size: 14px; }
  .leak .name i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; }
  .leak .amt { font-weight: 700; font-size: 15px; }
  .leak .meter { grid-column: 1 / -1; height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
  .leak .meter span { display: block; height: 100%; border-radius: 3px; }
  .leak .note { grid-column: 1 / -1; font-size: 12px; color: var(--sub); }
  .leak.total .name, .leak.total .amt { font-weight: 700; }
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .app .n { font-size: 12px; color: var(--sub); }
  .app .v { font-size: 17px; font-weight: 700; }
  .app .s { font-size: 11px; color: var(--sub); }

  /* 2·3. 주문 표 */
  .filters { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; }
  .filters button {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; white-space: nowrap; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: 13px; }
  th { text-align: right; font-weight: 600; color: var(--sub); font-size: 12px; padding: 8px 8px; border-bottom: 1px solid var(--line); }
  th:first-child { text-align: left; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
  td:first-child { text-align: left; }
  tr.order { cursor: pointer; }
  tr.order:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.order.bad td { background: var(--bad-bg); }
  tr.order.late td { background: var(--late-bg); }
  .o-meta { font-size: 12px; color: var(--sub); }
  .o-menu { display: block; max-width: 9.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .minus { color: var(--bad); }
  .paid { font-weight: 700; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-top: 2px; }
  .badge.bad { color: #fff; background: var(--bad); }
  .badge.late { color: #fff; background: var(--late); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.bad, :root:not([data-theme="light"]) .badge.late { color: #151514; } }
  tr.detail td { background: var(--bg); text-align: left; padding: 10px 12px 14px; }
  .dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 13px; }
  .dl .k { color: var(--sub); }
  .dl .v { text-align: right; }
  .dl .sep { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin: 4px 0; }
  .dl .em { font-weight: 700; }
  .why { margin-top: 8px; font-size: 13px; padding: 8px 10px; border-radius: 8px; }
  .why.bad { color: var(--bad); background: var(--bad-bg); }
  .why.late { color: var(--late); background: var(--late-bg); }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 2px 0; }

  footer { margin-top: 28px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px; font-size: 13px; color: var(--sub); }
  footer strong { color: var(--ink); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">배달 정산 맞추기 <span class="demo-tag">예시 데이터</span></p>

  <!-- 1. 요약 한 줄 -->
  <div class="hero">
    <h1 id="headline"></h1>
    <p class="hero-sub" id="headline-sub"></p>
    <div class="stack" id="stack" aria-hidden="true"></div>
    <div class="legend"><span>통장에 들어온 돈</span><span>빠진 돈</span></div>
    <div class="flags" id="flags"></div>
  </div>

  <!-- 4. 항목별 합계 -->
  <section>
    <h2>어디로 빠졌나 <small id="leak-range"></small></h2>
    <div class="leaks" id="leaks"></div>
    <div class="apps" id="apps"></div>
  </section>

  <!-- 2·3. 주문 건별 표 -->
  <section>
    <h2>주문 건별 <small>줄을 누르면 빠진 돈이 자세히 나와요</small></h2>
    <div class="filters" id="filters" role="group" aria-label="주문 거르기"></div>
    <table>
      <thead><tr><th>주문</th><th>판매</th><th>빠진 돈</th><th>통장</th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
    <p class="hint">빨간 줄은 예정액과 실제 입금이 다른 주문, 노란 줄은 입금일이 밀린 주문이에요.</p>
  </section>

  <!-- 5. 예시 데이터 안내 -->
  <footer>
    <strong>예시 데이터입니다.</strong> 주문·금액·입금일은 모두 지어낸 숫자예요.
    수수료율과 배달비도 설명을 위한 예시일 뿐, 실제 배달앱 요율이 아닙니다
    (요율은 계약·구간마다 다르고 자주 바뀝니다).
  </footer>
</main>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- 예시 설정 (실제 앱 요율 아님)
  var APPS = {
    'A앱': { brokerRate: 0.078, payRate: 0.030, delivery: 3100, settleDays: 3 },
    'B앱': { brokerRate: 0.078, payRate: 0.030, delivery: 3400, settleDays: 4 },
    'C앱': { brokerRate: 0.068, payRate: 0.025, delivery: 2900, settleDays: 3 }
  };
  var VAT = 0.10; // 중개·결제 수수료와 배달비에 붙는 부가세

  var MENU = {
    '아메리카노': 2500, '카페라떼': 3500, '바닐라라떼': 4000, '호지차라떼': 4300,
    '딸기스무디': 4800, '초코쉐이크': 4500, '크로플': 3800, '아이스티': 3000
  };

  // ---------------------------------------------------------------- 가짜 주문 (10/19 월 ~ 10/25 일)
  // [주문일, 배달앱, 메뉴, 할인·쿠폰 가게 부담, 광고비, 이상(선택)]
  var ORDERS = [
    ['2026-10-19', 'A앱', [['아메리카노', 2], ['카페라떼', 1], ['크로플', 1]], 0, 300],
    ['2026-10-19', 'B앱', [['바닐라라떼', 2], ['아메리카노', 1]], 1000, 0],
    ['2026-10-19', 'A앱', [['호지차라떼', 1], ['카페라떼', 1], ['아메리카노', 1]], 0, 300],
    ['2026-10-20', 'C앱', [['딸기스무디', 2], ['크로플', 1]], 0, 0],
    ['2026-10-20', 'A앱', [['아메리카노', 4]], 0, 300, { late: 2 }],
    ['2026-10-20', 'B앱', [['초코쉐이크', 1], ['카페라떼', 2], ['크로플', 1]], 2000, 0],
    ['2026-10-21', 'A앱', [['카페라떼', 2], ['아이스티', 1]], 1000, 300],
    ['2026-10-21', 'A앱', [['아메리카노', 3], ['크로플', 2]], 0, 300],
    ['2026-10-21', 'C앱', [['호지차라떼', 2], ['아메리카노', 1]], 0, 0],
    ['2026-10-22', 'B앱', [['아메리카노', 2], ['바닐라라떼', 1]], 0, 0, { short: 1500, why: '정산서에 "기타 차감 1,500원" — 무슨 돈인지 적혀 있지 않음' }],
    ['2026-10-22', 'A앱', [['딸기스무디', 1], ['초코쉐이크', 1], ['아메리카노', 2]], 0, 300],
    ['2026-10-22', 'A앱', [['카페라떼', 1], ['아메리카노', 1], ['크로플', 1]], 1000, 300],
    ['2026-10-23', 'C앱', [['아이스티', 2], ['아메리카노', 2]], 0, 0],
    ['2026-10-23', 'A앱', [['바닐라라떼', 2], ['호지차라떼', 2], ['크로플', 1]], 2000, 300],
    ['2026-10-23', 'B앱', [['아메리카노', 3], ['카페라떼', 1]], 0, 0, { late: 3 }],
    ['2026-10-23', 'A앱', [['초코쉐이크', 2], ['아메리카노', 1]], 0, 300],
    ['2026-10-24', 'A앱', [['아메리카노', 2], ['카페라떼', 2], ['크로플', 2]], 1000, 300],
    ['2026-10-24', 'B앱', [['딸기스무디', 2], ['아이스티', 1]], 1000, 0],
    ['2026-10-24', 'C앱', [['카페라떼', 3]], 0, 0],
    ['2026-10-24', 'A앱', [['호지차라떼', 1], ['아메리카노', 2]], 0, 300, { short: 800, why: '예정보다 800원 적게 입금 — 정산서에 따로 설명 없음' }],
    ['2026-10-25', 'A앱', [['아메리카노', 5], ['크로플', 1]], 2000, 300],
    ['2026-10-25', 'B앱', [['바닐라라떼', 1], ['카페라떼', 1], ['아메리카노', 1]], 0, 0],
    ['2026-10-25', 'A앱', [['딸기스무디', 1], ['아메리카노', 1], ['크로플', 1]], 0, 300, { late: 1 }],
    ['2026-10-25', 'C앱', [['초코쉐이크', 1], ['호지차라떼', 1], ['크로플', 1]], 1000, 0]
  ];

  // ---------------------------------------------------------------- 계산
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function parse(ds) { var p = ds.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function addBizDays(ds, n) {
    var d = parse(ds), k = 0;
    while (k < n) { d.setUTCDate(d.getUTCDate() + 1); var w = d.getUTCDay(); if (w !== 0 && w !== 6) k++; }
    return iso(d);
  }
  function md(ds) { var d = parse(ds); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '(' + DOW[d.getUTCDay()] + ')'; }
  function won(n) { return Math.round(n).toLocaleString('ko-KR'); }
  function man(n) { var v = n / 10000; return (Math.round(v * 10) / 10).toLocaleString('ko-KR') + '만'; }

  var rows = ORDERS.map(function (o, i) {
    var app = APPS[o[1]], x = o[5] || {};
    var sale = o[2].reduce(function (s, it) { return s + MENU[it[0]] * it[1]; }, 0);
    var broker = Math.round(sale * app.brokerRate);
    var pay = Math.round(sale * app.payRate);
    var delivery = app.delivery;
    var vat = Math.round((broker + pay + delivery) * VAT);
    var coupon = o[3], ad = o[4];
    var cut = broker + pay + vat + delivery + coupon + ad;
    var expected = sale - cut;
    var due = addBizDays(o[0], app.settleDays);
    var paidOn = x.late ? addBizDays(due, x.late) : due;
    var paid = expected - (x.short || 0);
    return {
      no: i + 1, date: o[0], app: o[1], items: o[2], sale: sale,
      broker: broker, pay: pay, vat: vat, delivery: delivery, coupon: coupon, ad: ad, cut: cut,
      expected: expected, paid: paid, due: due, paidOn: paidOn,
      short: x.short || 0, why: x.why || '', lateDays: x.late || 0
    };
  });

  function sum(key, list) { return (list || rows).reduce(function (s, r) { return s + r[key]; }, 0); }
  var T = {
    sale: sum('sale'), paid: sum('paid'), expected: sum('expected'),
    broker: sum('broker'), pay: sum('pay'), vat: sum('vat'), delivery: sum('delivery'), coupon: sum('coupon'), ad: sum('ad')
  };
  T.cut = T.sale - T.paid;
  var per10k = Math.round(T.paid / T.sale * 10000 / 100) * 100;
  var shortRows = rows.filter(function (r) { return r.short; });
  var lateRows = rows.filter(function (r) { return r.lateDays; });

  // ---------------------------------------------------------------- 1. 요약
  var range = md(rows[0].date) + '~' + md(rows[rows.length - 1].date);
  document.getElementById('headline').innerHTML =
    '이번 주 배달 <b>' + man(T.sale) + ' 원</b> 팔고,<br>통장엔 <b>' + man(T.paid) + ' 원</b> 들어왔어요' +
    '<br><span class="per">1만 원 팔면 ' + won(per10k) + '원</span>꼴';
  document.getElementById('headline-sub').textContent =
    range + ' · 주문 ' + rows.length + '건 · 빠진 돈 ' + won(T.cut) + '원 (판매의 ' + Math.round(T.cut / T.sale * 100) + '%)';

  var stack = document.getElementById('stack');
  var parts = [
    ['paid', T.paid, 'var(--accent)'],
    ['broker', T.broker, 'var(--c-fee)'], ['pay', T.pay, 'var(--c-pay)'], ['vat', T.vat, 'var(--c-vat)'],
    ['delivery', T.delivery, 'var(--c-deliv)'], ['coupon', T.coupon, 'var(--c-coupon)'], ['ad', T.ad, 'var(--c-ad)'],
    ['short', T.expected - T.paid, 'var(--bad)']
  ];
  parts.forEach(function (p, i) {
    var s = document.createElement('span');
    s.style.width = (p[1] / T.sale * 100) + '%';
    s.style.background = i === 0 ? 'var(--accent)' : p[2];
    if (i === 0) s.style.opacity = '0.35';
    stack.appendChild(s);
  });

  var flags = document.getElementById('flags');
  if (shortRows.length) {
    flags.insertAdjacentHTML('beforeend', '<span class="flag bad">예정보다 덜 들어옴 ' + shortRows.length + '건 · ' + won(T.expected - T.paid) + '원</span>');
  }
  if (lateRows.length) {
    flags.insertAdjacentHTML('beforeend', '<span class="flag late">입금일 밀림 ' + lateRows.length + '건</span>');
  }

  // ---------------------------------------------------------------- 4. 항목별 합계
  document.getElementById('leak-range').textContent = '판매 ' + won(T.sale) + '원 중';
  var LEAKS = [
    ['배달비 (가게 부담)', T.delivery, 'var(--c-deliv)', '주문 금액과 상관없이 건마다 고정 — 작은 주문일수록 아픔'],
    ['중개 수수료', T.broker, 'var(--c-fee)', '판매 금액의 일정 % (예시: 6.8~7.8%)'],
    ['할인·쿠폰 가게 부담', T.coupon, 'var(--c-coupon)', '쿠폰 붙은 주문 ' + rows.filter(function (r) { return r.coupon; }).length + '건'],
    ['결제 수수료', T.pay, 'var(--c-pay)', '예시: 2.5~3%'],
    ['수수료 부가세', T.vat, 'var(--c-vat)', '수수료·배달비의 10%'],
    ['광고비', T.ad, 'var(--c-ad)', '주문당으로 나눠 본 금액 (예시)'],
    ['설명 없이 덜 들어온 돈', T.expected - T.paid, 'var(--bad)', '아래 표의 빨간 줄']
  ].filter(function (l) { return l[1] > 0; }).sort(function (a, b) { return b[1] - a[1]; });
  var max = LEAKS[0][1];
  var leaksEl = document.getElementById('leaks');
  leaksEl.innerHTML = LEAKS.map(function (l) {
    return '<div class="leak"><span class="name"><i style="background:' + l[2] + '"></i>' + l[0] + '</span>' +
      '<span class="amt">' + won(l[1]) + '원</span>' +
      '<span class="meter"><span style="width:' + (l[1] / max * 100) + '%;background:' + l[2] + '"></span></span>' +
      '<span class="note">' + l[3] + ' · 판매의 ' + (l[1] / T.sale * 100).toFixed(1) + '%</span></div>';
  }).join('') +
    '<div class="leak total"><span class="name">합계</span><span class="amt minus">−' + won(T.cut) + '원</span></div>';

  var appsEl = document.getElementById('apps');
  appsEl.innerHTML = Object.keys(APPS).map(function (name) {
    var list = rows.filter(function (r) { return r.app === name; });
    var s = sum('sale', list), p = sum('paid', list);
    return '<div class="app"><div class="n">' + name + ' · ' + list.length + '건</div>' +
      '<div class="v">' + won(Math.round(p / s * 10000 / 100) * 100) + '원</div>' +
      '<div class="s">1만 원당 입금</div></div>';
  }).join('');

  // ---------------------------------------------------------------- 2·3. 주문 건별 표
  var filter = 'all';
  var open = {};
  var FILTERS = [['all', '전체 ' + rows.length], ['issue', '차이 있음 ' + (shortRows.length + lateRows.length)]]
    .concat(Object.keys(APPS).map(function (a) { return [a, a]; }));
  var filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = FILTERS.map(function (f) {
    return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (f[0] === filter) + '">' + f[1] + '</button>';
  }).join('');
  filtersEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(filtersEl.children, function (c) { c.setAttribute('aria-pressed', String(c === b)); });
    render();
  });

  function menuText(items) {
    return items.map(function (it) { return it[0] + (it[1] > 1 ? ' ' + it[1] : ''); }).join(' · ');
  }

  function detailHTML(r) {
    var line = function (k, v, cls) { return '<span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span>'; };
    var h = '<div class="dl">' +
      line('메뉴 금액', won(r.sale) + '원') +
      line('중개 수수료', '−' + won(r.broker), 'minus') +
      line('결제 수수료', '−' + won(r.pay), 'minus') +
      line('수수료 부가세', '−' + won(r.vat), 'minus') +
      line('배달비 (가게 부담)', '−' + won(r.delivery), 'minus') +
      line('할인·쿠폰 가게 부담', r.coupon ? '−' + won(r.coupon) : '0', r.coupon ? 'minus' : '') +
      line('광고비', r.ad ? '−' + won(r.ad) : '0', r.ad ? 'minus' : '') +
      '<span class="sep"></span>' +
      line('입금 예정액', won(r.expected) + '원', 'em') +
      line('실제 입금액', won(r.paid) + '원', 'em' + (r.short ? ' minus' : '')) +
      line('입금 예정일', md(r.due)) +
      line('실제 입금일', md(r.paidOn), r.lateDays ? 'minus' : '') +
      '</div>';
    if (r.short) h += '<div class="why bad">' + won(r.short) + '원 덜 들어옴 — ' + r.why + '</div>';
    if (r.lateDays) h += '<div class="why late">예정일보다 ' + r.lateDays + '영업일 늦게 들어옴</div>';
    return h;
  }

  var tbody = document.getElementById('orders');
  function render() {
    var list = rows.filter(function (r) {
      if (filter === 'all') return true;
      if (filter === 'issue') return r.short || r.lateDays;
      return r.app === filter;
    });
    tbody.innerHTML = list.map(function (r) {
      var cls = r.short ? 'bad' : r.lateDays ? 'late' : '';
      var badge = r.short ? '<span class="badge bad">' + won(r.short) + '원 덜</span>'
        : r.lateDays ? '<span class="badge late">' + r.lateDays + '일 늦음</span>' : '';
      var tr = '<tr class="order ' + cls + '" data-no="' + r.no + '" tabindex="0" aria-expanded="' + !!open[r.no] + '">' +
        '<td><span class="o-meta">' + md(r.date) + ' · ' + r.app + '</span><span class="o-menu">' + menuText(r.items) + '</span></td>' +
        '<td>' + won(r.sale) + '</td>' +
        '<td class="minus">−' + won(r.cut + r.short) + '</td>' +
        '<td><span class="paid">' + won(r.paid) + '</span><br><span class="o-meta">' + md(r.paidOn) + '</span>' + (badge ? '<br>' + badge : '') + '</td>' +
        '</tr>';
      if (open[r.no]) tr += '<tr class="detail"><td colspan="4">' + detailHTML(r) + '</td></tr>';
      return tr;
    }).join('');
  }
  function toggle(tr) { var no = tr.getAttribute('data-no'); open[no] = !open[no]; render(); }
  tbody.addEventListener('click', function (e) { var tr = e.target.closest('tr.order'); if (tr) toggle(tr); });
  tbody.addEventListener('keydown', function (e) {
    var tr = e.target.closest('tr.order');
    if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(tr); tbody.querySelector('tr[data-no="' + tr.getAttribute('data-no') + '"]').focus(); }
  });

  // 처음엔 덜 들어온 주문 하나를 펼쳐서 보여 줌
  if (shortRows[0]) open[shortRows[0].no] = true;
  render();
})();
</script>
</body>
</html>
