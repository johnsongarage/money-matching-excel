<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>news.html 공유 그림 원본</title>
<!--
  news.html(배달앱 소식)의 링크 미리보기 그림 원본. 1200×630으로 찍어 og-news.png로 둔다(카톡·문자에 주소를 붙이면 보이는 그림).
  제목 숫자나 문구가 바뀌면 이 파일을 고치고 다시 찍는다: 헤드리스 크롬으로 이 파일을 1200×630 화면에 열어 스크린샷.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #ffffff; color: #111827; word-break: keep-all;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .bar { height: 16px; background: #f4c20d; }
  .in { padding: 64px 84px 0; }
  .k { font-size: 30px; font-weight: 700; color: #8a6400; margin: 0 0 22px; }
  h1 { font-size: 80px; line-height: 1.22; font-weight: 800; letter-spacing: -2.5px; margin: 0 0 30px; }
  h1 span { color: #a87b00; }
  p.s { font-size: 34px; line-height: 1.5; font-weight: 500; color: #374151; margin: 0; }
  .f { position: absolute; left: 84px; bottom: 44px; font-size: 26px; font-weight: 600; color: #6b7280; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="in">
    <p class="k">배달앱 소식</p>
    <h1>배달앱 과징금 6,319억 원.<br><span>그래서 우리 가게는?</span></h1>
    <p class="s">뉴스에서 우리 가게에 달라지는 것만 추렸어요.<br>버튼 몇 개로 한 달에 얼마인지 어림해 드려요.</p>
  </div>
  <div class="f">존슨거라지 · 배달 계산</div>
</body>
</html>
