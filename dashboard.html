<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>배달 정산 대시보드</title>
<meta name="description" content="배달 정산 맞추기 — 대시보드형 디자인 (예시 데이터)">
<style>
  :root {
    --page: #f7f7f8; --panel: #ffffff; --ink: #111827; --sub: #6b7280; --faint: #9ca3af;
    --line: #e5e7eb; --line-strong: #d1d5db; --head: #f3f4f6; --hover: #f3f4f6; --nav-active: #eef0f2;
    --green: #16a34a; --green-bg: #dcfce7; --red: #dc2626; --red-bg: #fee2e2; --amber: #b45309; --amber-bg: #fef3c7;
    --shade: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #111214; --panel: #1a1b1e; --ink: #f3f4f6; --sub: #a1a1aa; --faint: #71717a;
      --line: #2c2d31; --line-strong: #3a3b40; --head: #222327; --hover: #232428; --nav-active: #26272b;
      --green: #4ade80; --green-bg: #14321f; --red: #f87171; --red-bg: #3b1a1a; --amber: #fbbf24; --amber-bg: #3a2c0d;
      --shade: #202125;
    }
  }
  :root[data-theme="dark"] {
    --page: #111214; --panel: #1a1b1e; --ink: #f3f4f6; --sub: #a1a1aa; --faint: #71717a;
    --line: #2c2d31; --line-strong: #3a3b40; --head: #222327; --hover: #232428; --nav-active: #26272b;
    --green: #4ade80; --green-bg: #14321f; --red: #f87171; --red-bg: #3b1a1a; --amber: #fbbf24; --amber-bg: #3a2c0d;
    --shade: #202125;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; }

  /* 틀: 왼쪽 메뉴 + 본문 */
  .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; }
  .brand { font-weight: 700; font-size: 15px; padding: 6px 10px 18px; }
  .brand small { display: block; font-weight: 400; font-size: 11px; color: var(--sub); }
  .nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .nav li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--sub); font-size: 14px; }
  .nav li svg { width: 16px; height: 16px; flex: none; }
  .nav li a { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; width: 100%; }
  .nav li:has(a):hover { background: var(--hover); color: var(--ink); }
  .nav li.active { background: var(--nav-active); color: var(--ink); font-weight: 600; }
  .nav li.off { cursor: default; }
  .nav li.off small { margin-left: auto; font-size: 11px; color: var(--faint); }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .top-right { display: flex; align-items: center; gap: 14px; }
  .up-top { display: none; font-size: 13px; font-weight: 600; color: var(--green); text-decoration: none; white-space: nowrap; }
  .refs-pick { font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .refs-pick select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; max-width: 13em; }
  .design-pick { font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .design-pick select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; }
  .store { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--line-strong); display: grid; place-items: center; color: var(--panel); }
  .avatar svg { width: 16px; height: 16px; }

  .content { padding: 16px 20px 32px; display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }

  /* 숫자 카드 */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .kpi { padding: 14px 16px 16px; }
  .kpi .label { font-size: 15px; font-weight: 600; margin: 0; }
  .kpi .value { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 2px; }
  .kpi .num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
  .kpi .num.green { color: var(--green); }
  .kpi .num.red { color: var(--red); }
  .chip { font-size: 12px; font-weight: 600; border-radius: 5px; padding: 2px 7px; white-space: nowrap; }
  .chip.green { color: var(--green); background: var(--green-bg); }
  .kpi .desc { font-size: 12px; color: var(--sub); margin: 0; }

  /* 달력 카드 */
  .cal-card { padding: 12px 14px 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .month { display: flex; align-items: center; gap: 6px; }
  .month h2 { margin: 0; font-size: 16px; font-weight: 700; min-width: 8.5em; }
  .month button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; display: grid; place-items: center; }
  .month button:disabled { opacity: 0.35; cursor: default; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 500; border-radius: 6px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 6px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .pill.red { color: var(--red); background: var(--red-bg); }
  .pill.red i { background: var(--red); }
  .pill.amber { color: var(--amber); background: var(--amber-bg); }
  .pill.amber i { background: var(--amber); }
  .pill.green { color: var(--green); background: var(--green-bg); }
  .pill.green i { background: var(--green); }

  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .grid .dow { background: var(--head); text-align: center; font-size: 12px; font-weight: 500; padding: 5px 2px; border-bottom: 1px solid var(--line-strong); }
  .grid .dow + .dow { border-left: 1px solid var(--line); }
  .cell {
    position: relative; min-height: 72px; padding: 5px 7px; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
    background: var(--panel); text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; border-right: 0; border-bottom: 0;
  }
  .cell:nth-child(7n + 1) { border-left: 0; }
  .grid .dow ~ .cell:nth-child(-n + 14) { border-top: 0; }
  .cell.blank { background: var(--panel); }
  button.cell { cursor: pointer; }
  button.cell:hover { background: var(--hover); }
  .cell.flag { background: var(--shade); }
  .cell .d { font-size: 12px; }
  .cell .d b { font-weight: 600; }
  .cell .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; }
  .cell .dot.red { background: var(--red); }
  .cell .dot.amber { background: var(--amber); }
  .cell .t { font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .t.red { color: var(--red); }
  .cell .t.amber { color: var(--amber); }
  .cell .t.green { color: var(--green); }
  .cell .t.sub { color: var(--sub); }
  .cell .t.m { display: none; }
  .cell.today .d b { background: var(--ink); color: var(--panel); border-radius: 4px; padding: 0 4px; }
  .cell[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }

  /* 정산 표 */
  .tbl-card { overflow: hidden; }
  .tbl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .tbl-top h2 { margin: 0; font-size: 14px; font-weight: 700; }
  .tbl-top button { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:nth-child(-n + 2), td:nth-child(-n + 2) { text-align: left; }
  thead th { font-weight: 600; background: var(--panel); }
  tr.group td { background: var(--head); font-size: 11px; font-weight: 700; color: var(--sub); padding: 7px 14px; letter-spacing: 0.02em; }
  tr.group td b { color: var(--ink); }
  td .s { display: block; font-size: 11px; color: var(--sub); }
  td .s.red { color: var(--red); font-weight: 600; }
  td .s.amber { color: var(--amber); font-weight: 600; }
  td.desc { white-space: normal; min-width: 14em; }
  td.neg { color: var(--sub); }
  td.net { font-weight: 600; }
  td.net.red { color: var(--red); }
  tr.empty td { text-align: center; color: var(--sub); }

  .foot { font-size: 12px; color: var(--sub); margin: 0; }
  .foot b { color: var(--ink); }

  /* 좁은 화면(휴대폰): 메뉴는 위로 접고, 달력 칸은 점만 */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .top { padding: 10px 16px; flex-wrap: wrap; }
    .top h1 { font-size: 16px; }
    .store { display: none; }
    .top-right { flex-wrap: wrap; gap: 6px 12px; width: 100%; }
    .refs-pick select { max-width: 11em; }
    .up-top { display: inline; }
    .content { padding: 12px 16px 28px; }
    .kpis { grid-template-columns: 1fr; gap: 10px; }
    .kpi .num { font-size: 26px; }
    .cell { min-height: 52px; padding: 4px 4px; }
    .cell .t { display: none; }
    .cell .t.m { display: block; font-size: 10px; }
    .cell .dot { top: 6px; right: 5px; }
    th, td { padding: 8px 10px; }
    th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; }
    td.desc { min-width: 0; }
    th, td { white-space: normal; vertical-align: top; }
    td:first-child { width: 28%; }
    td:last-child, th:last-child { white-space: nowrap; }
    tr.group td { white-space: normal; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="메뉴">
    <div class="brand">정산 맞추기<small>예시 데이터</small></div>
    <ul class="nav">
      <li class="off" title="데모에서는 정산 화면만 있어요"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>대시보드<small>준비 중</small></li>
      <li class="active" aria-current="page"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/><path d="M2 6.5h12M10.5 9.5h1.5"/></svg>정산</li>
      <li class="off" title="데모에서는 정산 화면만 있어요"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 5h10l-2.5-2.5M13 11H3l2.5 2.5"/></svg>거래 내역<small>준비 중</small></li>
      <li><a href="upload.html"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 10.5V2.5M5 5.5l3-3 3 3M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>내 파일로 맞추기</a></li>
      <li class="off" title="데모에서는 정산 화면만 있어요"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg>설정<small>준비 중</small></li>
    </ul>
  </aside>

  <div class="main">
    <header class="top">
      <h1>배달 정산</h1>
      <div class="top-right">
        <a class="up-top" href="upload.html">내 파일로 맞추기</a>
        <span data-refs></span>
        <span data-screens></span>
        <span class="store">예시 가게 <span class="avatar" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="6" r="3"/><path d="M2.5 14c.6-2.8 2.9-4.3 5.5-4.3s4.9 1.5 5.5 4.3z"/></svg></span></span>
      </div>
    </header>

    <div class="content">
      <div class="kpis">
        <div class="card kpi">
          <p class="label">통장 입금 합계</p>
          <div class="value"><span class="num green" id="k-paid"></span><span class="chip green" id="k-per"></span></div>
          <p class="desc" id="k-paid-desc"></p>
        </div>
        <div class="card kpi">
          <p class="label">빠진 돈 합계</p>
          <div class="value"><span class="num red" id="k-cut"></span></div>
          <p class="desc" id="k-cut-desc"></p>
        </div>
      </div>

      <section class="card cal-card" aria-labelledby="month-title">
        <div class="cal-head">
          <div class="month">
            <button type="button" id="prev" aria-label="이전 달">‹</button>
            <h2 id="month-title"></h2>
            <button type="button" id="next" aria-label="다음 달">›</button>
          </div>
          <div class="pills">
            <span class="pill red"><i></i>입금 누락</span>
            <span class="pill red"><i></i>덜 들어옴</span>
            <span class="pill amber"><i></i>늦게 입금</span>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <section class="card tbl-card">
        <div class="tbl-top">
          <h2 id="tbl-title">정산 내역</h2>
          <button type="button" id="show-all" hidden>전체 보기</button>
        </div>
        <div class="tbl-scroll">
          <table>
            <thead><tr><th>입금일</th><th>내용</th><th>판매 금액</th><th>빠진 돈</th><th>실입금</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>

      <p class="foot"><b>예시 데이터입니다.</b> 주문·금액·입금일은 모두 지어낸 숫자예요. 수수료율과 배달비도 설명을 위한 예시일 뿐, 실제 배달앱 요율이 아닙니다.</p>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.DEMO;
  var rows = D.rows, T = D.T, won = D.won, md = D.md, parse = D.parse, iso = D.iso, sum = D.sum;


  // ---------------------------------------------------------------- 숫자 카드
  var per10k = Math.round(T.paid / T.sale * 10000 / 100) * 100;
  var shortSum = sum('short');
  var fees = T.broker + T.pay + T.vat;
  document.getElementById('k-paid').textContent = won(T.paid) + '원';
  document.getElementById('k-per').textContent = '1만 원당 ' + won(per10k) + '원';
  document.getElementById('k-paid-desc').textContent =
    '판매 ' + won(T.sale) + '원 중 · ' + md(rows[0].date) + '~' + md(rows[rows.length - 1].date) + ' 주문 ' + rows.length + '건';
  document.getElementById('k-cut').textContent = won(T.cut) + '원';
  document.getElementById('k-cut-desc').textContent =
    '배달비 ' + won(T.delivery) + ' · 수수료·부가세 ' + won(fees) + ' · 할인·광고 ' + won(T.coupon + T.ad) +
    (shortSum ? ' · 설명 없이 덜 들어옴 ' + won(shortSum) : '');

  // ---------------------------------------------------------------- 달력 (일요일 시작, 월 단위)
  var months = [];
  rows.forEach(function (r) {
    [r.date, r.paidOn, r.due].forEach(function (d) { var m = d.slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
  });
  months.sort();
  var mi = 0;
  var selected = null;

  function info(ds) {
    var paid = rows.filter(function (r) { return r.paidOn === ds; });
    var sold = rows.filter(function (r) { return r.date === ds; });
    var missed = rows.filter(function (r) { return r.lateDays && r.due === ds; });
    var short = paid.filter(function (r) { return r.short; });
    var late = paid.filter(function (r) { return r.lateDays; });
    return { paid: paid, sold: sold, missed: missed, short: short, late: late };
  }

  function renderCal() {
    var ym = months[mi];
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    document.getElementById('month-title').textContent = y + '년 ' + m + '월';
    document.getElementById('prev').disabled = mi === 0;
    document.getElementById('next').disabled = mi === months.length - 1;
    var first = new Date(Date.UTC(y, m - 1, 1));
    var days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var h = ['일', '월', '화', '수', '목', '금', '토'].map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    var lead = first.getUTCDay();
    for (var i = 0; i < lead; i++) h += '<div class="cell blank"></div>';
    for (var day = 1; day <= days; day++) {
      var ds = iso(new Date(Date.UTC(y, m - 1, day)));
      var x = info(ds);
      var any = x.paid.length || x.sold.length || x.missed.length;
      var flagRed = x.missed.length || x.short.length;
      var flagAmber = !flagRed && x.late.length;
      var label = (day === 1 ? m + '/' : '') + day;
      var inner = '<span class="d"><b>' + label + '</b></span>';
      if (flagRed) inner += '<span class="dot red"></span>';
      else if (flagAmber) inner += '<span class="dot amber"></span>';
      if (x.missed.length) inner += '<span class="t red">입금 누락 ' + x.missed.length + '건</span>';
      if (x.short.length) inner += '<span class="t red">덜 들어옴 −' + won(sum('short', x.short)) + '</span>';
      if (x.late.length) inner += '<span class="t amber">늦게 입금 ' + x.late.length + '건</span>';
      if (x.paid.length) inner += '<span class="t green">입금 ' + won(sum('paid', x.paid)) + '</span>';
      if (x.sold.length) inner += '<span class="t sub">판매 ' + won(sum('sale', x.sold)) + '</span>';
      if (x.paid.length || x.sold.length) inner += '<span class="t m ' + (x.paid.length ? 'green' : 'sub') + '">' + D.man(x.paid.length ? sum('paid', x.paid) : sum('sale', x.sold)) + '</span>';
      var cls = 'cell' + (flagRed || flagAmber ? ' flag' : '') + (ds === D.TODAY ? ' today' : '');
      if (any) {
        h += '<button type="button" class="' + cls + '" data-d="' + ds + '" aria-pressed="' + (ds === selected) + '" aria-label="' + md(ds) + ' 내역 보기">' + inner + '</button>';
      } else {
        h += '<div class="' + cls + '">' + inner + '</div>';
      }
    }
    var tail = (7 - ((lead + days) % 7)) % 7;
    for (var j = 0; j < tail; j++) h += '<div class="cell blank"></div>';
    document.getElementById('grid').innerHTML = h;
  }

  document.getElementById('prev').addEventListener('click', function () { if (mi > 0) { mi--; renderCal(); } });
  document.getElementById('next').addEventListener('click', function () { if (mi < months.length - 1) { mi++; renderCal(); } });
  document.getElementById('grid').addEventListener('click', function (e) {
    var b = e.target.closest('button.cell'); if (!b) return;
    var ds = b.getAttribute('data-d');
    selected = selected === ds ? null : ds;
    renderCal(); renderTable();
  });
  document.getElementById('show-all').addEventListener('click', function () { selected = null; renderCal(); renderTable(); });

  // ---------------------------------------------------------------- 정산 표 (구역별)
  function rowHTML(r, mode) {
    var when = md(r.paidOn) + (r.lateDays ? '<span class="s amber">예정 ' + md(r.due) + ' · ' + r.lateDays + '영업일 늦음</span>' : '');
    if (mode === 'missed') when = '<span style="color:var(--red);font-weight:600">안 들어옴</span><span class="s">예정 ' + md(r.due) + ' → 실제 ' + md(r.paidOn) + '</span>';
    var desc = r.app + ' · ' + md(r.date) + ' 주문<span class="s">' + D.menuText(r.items) + (r.short ? ' · ' + r.why : '') + '</span>';
    var net = mode === 'missed'
      ? '<td class="net red">0원<span class="s">예정 ' + won(r.expected) + '원</span></td>'
      : '<td class="net' + (r.short ? ' red' : '') + '">' + won(r.paid) + '원' + (r.short ? '<span class="s red">예정보다 −' + won(r.short) + '</span>' : '') + '</td>';
    return '<tr><td>' + when + '</td><td class="desc">' + desc + '</td><td>' + won(r.sale) + '원</td>' +
      '<td class="neg">−' + won(r.cut + r.short) + '원</td>' + net + '</tr>';
  }
  function group(title, list, mode) {
    if (!list.length) return '';
    var total = mode === 'missed' ? sum('expected', list) : sum('paid', list);
    return '<tr class="group"><td colspan="5">' + title + ' · <b>' + list.length + '건</b> · ' + (mode === 'missed' ? '예정액 ' : '') + won(total) + '원</td></tr>' +
      list.map(function (r) { return rowHTML(r, mode); }).join('');
  }
  function byPaid(a, b) { return a.paidOn < b.paidOn ? -1 : a.paidOn > b.paidOn ? 1 : a.no - b.no; }

  function renderTable() {
    var h = '';
    var title = '정산 내역';
    if (selected) {
      var x = info(selected);
      title = md(selected) + ' 정산 내역';
      h += group('이날 들어왔어야 했는데 안 온 돈', x.missed, 'missed');
      h += group('이날 들어온 돈', x.paid.slice().sort(byPaid), 'paid');
      if (!x.missed.length && !x.paid.length) {
        h += '<tr class="empty"><td colspan="5">이날 들어온 돈은 없어요. 이날 판 ' + x.sold.length + '건은 ' +
          x.sold.map(function (r) { return md(r.paidOn); }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ') + '에 들어왔어요.</td></tr>';
      }
    } else {
      var shortL = rows.filter(function (r) { return r.short; }).sort(byPaid);
      var lateL = rows.filter(function (r) { return r.lateDays && !r.short; }).sort(byPaid);
      var okL = rows.filter(function (r) { return !r.short && !r.lateDays; }).sort(byPaid);
      h += group('확인 필요 — 예정보다 덜 들어옴', shortL, 'paid');
      h += group('늦게 들어옴', lateL, 'paid');
      h += group('정상 입금', okL, 'paid');
    }
    document.getElementById('tbl-title').textContent = title;
    document.getElementById('show-all').hidden = !selected;
    document.getElementById('tbody').innerHTML = h;
  }

  renderCal();
  renderTable();
})();
</script>
<script src="refs.js"></script>
<script src="screens.js"></script>
</body>
